<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Day Grocery List</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
      background-color: #fafafa;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.15rem;
      color: #2c5e3b;
      margin-top: 24px;
      margin-bottom: 8px;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    li {
      margin-bottom: 10px;
      font-size: 1.05rem;
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 3px;
      accent-color: #2c5e3b;
      flex-shrink: 0;
    }
   </style>
</head>
<body>

  <h1>Grocery List</h1>

  <h2>Deli</h2>
  <ul>
	<li><label><input type="checkbox"><span>Hummus</span></label></li>
    <li><label><input type="checkbox"><span>Rotisserie Chicken</span></label></li>
  </ul> 

  <h2>Dairy</h2>
  <ul>
	<li><label><input type="checkbox"><span>Milks</span></label></li>
    <li><label><input type="checkbox"><span>Butter</span></label></li>
  	<li><label><input type="checkbox"><span>Yogurt Starter</span></label></li>
	<li><label><input type="checkbox"><span>Cottage Cheese</span></label></li>
	<li><label><input type="checkbox"><span>Cheddar Cheese</span></label></li>
  </ul>

 <h2>Meat, Eggs &amp; Seafood</h2>
  <ul>
    <li><label><input type="checkbox"><span>Salmon</span></label></li>
    <li><label><input type="checkbox"><span>Bison</span></label></li>
    <li><label><input type="checkbox"><span>Chicken</span></label></li>
	<li><label><input type="checkbox"><span>Eggs</span></label></li> 
  </ul>
	
<h2>Freezer</h2>
  <ul>
    <li><label><input type="checkbox"><span>Frozen spinach</span></label></li>
	<li><label><input type="checkbox"><span>Boca Burgers</span></label></li>
	<li><label><input type="checkbox"><span>Chimichangas</span></label></li>
	<li><label><input type="checkbox"><span>Frozen Fruit</span></label></li>
  </ul>

  <h2>Pantry</h2>
  <ul>
    <li><label><input type="checkbox"><span>Tortillas</span></label></li>	
    <li><label><input type="checkbox"><span>Walnuts</span></label></li>
	<li><label><input type="checkbox"><span>Sunflower seeds</span></label></li>
	<li><label><input type="checkbox"><span>Chocolate</span></label></li>
	<li><label><input type="checkbox"><span>Cereal</span></label></li>
	<li><label><input type="checkbox"><span>Oatmeal</span></label></li>
    <li><label><input type="checkbox"><span>Figgy Bars</span></label></li>
	<li><label><input type="checkbox"><span>Salad Dressing</span></label></li>
	<li><label><input type="checkbox"><span>Peanuts</span></label></li>
	<li><label><input type="checkbox"><span>Noodles</span></label></li>
   </span></label></li>
  </ul>	

<h2>Baking</h2>
  <ul>
	<li><label><input type="checkbox"><span>Bread Flour</span></label></li>
    <li><label><input type="checkbox"><span>Whole Wheat Flour</span></label></li>
    <li><label><input type="checkbox"><span>Ground Flax</span></label></li>
    <li><label><input type="checkbox"><span>Yeast</span></label></li>
	<li><label><input type="checkbox"><span>Powdered Milk</span></label></li>
  	<li><label><input type="checkbox"><span>Honey</span></label></li>
  </ul>
	
  <h2>Produce</h2>
  <ul>
	<li><label><input type="checkbox"><span>Tofu</span></label></li>
	<li><label><input type="checkbox"><span>Sweet potatoes</span></label></li>
    <li><label><input type="checkbox"><span>Blueberries</span></label></li>
    <li><label><input type="checkbox"><span>Tangerines</span></label></li>
    <li><label><input type="checkbox"><span>Lemons</span></label></li>
	<li><label><input type="checkbox"><span>Avocado</span></label></li>
    <li><label><input type="checkbox"><span>Cabbage</span></label></li>
    <li><label><input type="checkbox"><span>Cucumber</span></label></li>
    <li><label><input type="checkbox"><span>Broccoli</span></label></li>
	<li><label><input type="checkbox"><span>Kale</span></label></li>
    <li><label><input type="checkbox"><span>Brussels Sprouts</span></label></li>
    <li><label><input type="checkbox"><span>Green beans</span></label></li>
    <li><label><input type="checkbox"><span>Carrots</span></label></li>
    <li><label><input type="checkbox"><span>Onions/Garlic/Herbs</span></label></li>
  </ul>

<div style="position: sticky; top: 0; background: #fafafa; padding: 10px 0; border-bottom: 1px solid #ddd; margin-bottom: 15px; display: flex; gap: 10px;">
  <button id="filterBtn" style="padding: 8px 14px; font-size: 0.95rem; border-radius: 6px; border: 1px solid #2c5e3b; background: #2c5e3b; color: white; cursor: pointer;">
    Store Mode: Show Checked Only
  </button>
  <button id="clearBtn" style="padding: 8px 14px; font-size: 0.95rem; border-radius: 6px; border: 1px solid #ccc; background: white; color: #333; cursor: pointer;">
    Uncheck All
  </button>
</div>

<script>
  const boxes = document.querySelectorAll('input[type="checkbox"]');
  const filterBtn = document.getElementById('filterBtn');
  const clearBtn = document.getElementById('clearBtn');
  let storeMode = false;

  // Move sticky bar to top of body
  document.body.insertBefore(filterBtn.parentElement, document.body.children[1]);

  // Load saved state by item text
  boxes.forEach(box => {
    const key = 'grocery_' + box.parentElement.innerText.trim();
    if (localStorage.getItem(key) === 'true') box.checked = true;

    box.addEventListener('change', () => {
      localStorage.setItem(key, box.checked);
      if (storeMode) applyFilter();
    });
  });

  function applyFilter() {
    boxes.forEach(box => {
      box.closest('li').style.display = (!storeMode || box.checked) ? '' : 'none';
    });
    // Hide empty category headers in Store Mode
    document.querySelectorAll('h2').forEach(h2 => {
      const ul = h2.nextElementSibling;
      if (ul && ul.tagName === 'UL') {
        const hasVisible = Array.from(ul.children).some(li => li.style.display !== 'none');
        h2.style.display = hasVisible ? '' : 'none';
      }
    });
  }

  filterBtn.addEventListener('click', () => {
    storeMode = !storeMode;
    filterBtn.textContent = storeMode ? 'Edit Mode: Show All Items' : 'Store Mode: Show Checked Only';
    filterBtn.style.background = storeMode ? '#b85d19' : '#2c5e3b';
    filterBtn.style.borderColor = storeMode ? '#b85d19' : '#2c5e3b';
    applyFilter();
  });

  clearBtn.addEventListener('click', () => {
    boxes.forEach(box => {
      box.checked = false;
      localStorage.removeItem('grocery_' + box.parentElement.innerText.trim());
    });
    if (storeMode) applyFilter();
  });
</script>

</body>
</html>
