<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Day Grocery List</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
      background-color: #fafafa;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.15rem;
      color: #2c5e3b;
      margin-top: 24px;
      margin-bottom: 8px;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    li {
      margin-bottom: 10px;
      font-size: 1.05rem;
    }
    label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 3px;
      accent-color: #2c5e3b;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>3-Day Grocery List</h1>

  <h2>Meat &amp; Seafood</h2>
  <ul>
    <li><label><input type="checkbox"><span>Salmon</span></label></li>
    <li><label><input type="checkbox"><span>Bison</span></label></li>
    <li><label><input type="checkbox"><span>Chicken</span></label></li>
  </ul>

  <h2>Dairy &amp; Freezer</h2>
  <ul>
    <li><label><input type="checkbox"><span>Cottage Cheese</span></label></li>
    <li><label><input type="checkbox"><span>Frozen sliced peaches</span></label></li>
	<li><label><input type="checkbox"><span>Milks</span></label></li>
	<li><label><input type="checkbox"><span>Yogurt</span></label></li>
	<li><label><input type="checkbox"><span>Eggs</span></label></li>
  </ul>

  <h2>Fresh Fruit</h2>
  <ul>
    <li><label><input type="checkbox"><span>blueberries</span></label></li>
    <li><label><input type="checkbox"><span>Tangerines</span></label></li>
    <li><label><input type="checkbox"><span>Lemons</span></label></li>
	<li><label><input type="checkbox"><span>Avocado</span></label></li>
  </ul>

  <h2>Fresh Vegetables</h2>
  <ul>
    <li><label><input type="checkbox"><span>Mixed salad greens</span></label></li>
    <li><label><input type="checkbox"><span>Cucumber</span></label></li>
    <li><label><input type="checkbox"><span>Broccoli</span></label></li>
	<li><label><input type="checkbox"><span>Kale</span></label></li>
    <li><label><input type="checkbox"><span>Brussels Sprouts</span></label></li>
    <li><label><input type="checkbox"><span>Green beans</span></label></li>
    <li><label><input type="checkbox"><span>Carrots</span></label></li>
    <li><label><input type="checkbox"><span>Red onion (1 small) &amp; garlic (1 bulb)</span></label></li>
  </ul>

  <h2>Starches &amp; Pantry (Check Stock)</h2>
  <ul>
    <li><label><input type="checkbox"><span>Tortillas</span></label></li>
	<li><label><input type="checkbox"><span>Sweet potatoes</span></label></li>
    <li><label><input type="checkbox"><span>Walnuts</span></label></li>
	<li><label><input type="checkbox"><span>Sunflower seeds</span></label></li>
   </span></label></li>
  </ul>

</body>
</html>
